[build]
  publish = "public"
  # Netlify serves the static HTML/JS/CSS frontend.
  # The Python backend (server.py) runs on Railway — see railway.json.

# Proxy all /api/* calls from Netlify frontend → Railway Python backend.
# IMPORTANT: Replace the URL below with your actual Railway service URL after deploying.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-RAILWAY-URL.railway.app/api/:splat"
  status = 200
  force = true
